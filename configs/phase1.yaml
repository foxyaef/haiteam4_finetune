# Phase 1 uses the already selected RT-DETR v1 R50 checkpoint from finetune.yaml.
seed: 42
evaluation_size: 1000
evaluation_split: val
calibration_size: 512
weight_bits: [8, 6, 4]
activation_bits: [8, 6, 4]
weight_scheme: symmetric_per_output_channel_minmax
activation_scheme: asymmetric_per_tensor_minmax
activation_observation: fp32_inputs
quantizable_modules: [Conv2d, Linear]
excluded_ops: [BatchNorm, LayerNorm, Softmax, functional_attention_matmul, deformable_sampling]
calibration_batch_size: 1
evaluation_batch_size: 1
image_size: 640
postprocess_top_queries: 300
coco_max_dets: 100
run_dir: runs/phase1
