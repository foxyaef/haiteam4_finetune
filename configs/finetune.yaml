seed: 42
device: cuda
input_size: 640
epochs: 50
batch_size: 1
accumulation_steps: 8
workers: 0
lr: 0.0001
backbone_lr: 0.00001
weight_decay: 0.0001
warmup_epochs: 1
min_lr_ratio: 0.01
clip_grad_norm: 0.1
horizontal_flip: 0.5
early_stopping_patience: 10
precision: fp32
score_threshold: 0.5
pr_iou: 0.5
coco_max_dets: 100
calibration_size: 512
bbox_coordinate_convention: scalabel_inclusive
train_images: data/bdd100k/images/100k/train
val_images: data/bdd100k/images/100k/val
train_labels: data/bdd100k/labels/official_raw/det_train.json
val_labels: data/bdd100k/labels/official_raw/det_val.json
train_annotations: data/annotations/train.json
val_annotations: data/annotations/val.json
initial_checkpoint: weights/rtdetr_r50vd_6x_coco_from_paddle.pth
output: runs/fp32
